<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨页 · 原型总览</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f2ef;color:#2d352e;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:54px 50px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px}.eyebrow{font-size:11px;letter-spacing:3px;color:#89978a}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:12px 0}header p{color:#919b91;font-size:12px;margin-bottom:0}a{color:inherit;text-decoration:none}.entry{background:#354639;color:white;padding:13px 20px;border-radius:8px;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 26px}.item{margin:0}.item img{width:100%;display:block;border:1px solid #e0e5dc;border-radius:8px;box-shadow:0 8px 25px #20301e07}.label{display:flex;align-items:center;gap:10px;margin:14px 0 7px}.label em{font-size:10px;font-style:normal;color:#9cab98;letter-spacing:1px}.label b{font-size:14px;font-weight:500}.item p{color:#98a194;font-size:11px;margin:0;line-height:1.8}footer{display:flex;justify-content:space-between;border-top:1px solid #dfe5d9;margin-top:35px;padding-top:20px;color:#929d8d;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:30px 20px}header{display:block}.entry{display:inline-block;margin-top:20px}}</style></head><body><main><header><div><div class="eyebrow">MOYE / MARKDOWN IDE</div><h1>让想法，自然成文。</h1><p>三栏写作空间 · 即时渲染与分屏 · 可收起 AI 助手 · 自由切换风格</p></div><a class="entry" href="index.html">打开交互原型 ↗</a></header><div class="grid"><figure class="item"><a href="01-主界面-元素与AI展开.png"><img src="01-主界面-元素与AI展开.png" alt="主界面"></a><div class="label"><em>01 / DEFAULT</em><b>安静、有序的写作空间</b></div><p>左侧拖放元素，中间即时编写，右侧目录定位；AI 默认展开。</p></figure><figure class="item"><a href="02-源码预览-双栏分屏.png"><img src="02-源码预览-双栏分屏.png" alt="源码预览分屏"></a><div class="label"><em>02 / SPLIT VIEW</em><b>语法与呈现，同时看见</b></div><p>仅拆分中间编辑区，源码与预览并排，侧栏与 AI 位置保持稳定。</p></figure><figure class="item"><a href="03-文件管理-AI收起.png"><img src="03-文件管理-AI收起.png" alt="文件区与AI收起"></a><div class="label"><em>03 / FOCUSED WRITING</em><b>工具收起，内容向前</b></div><p>元素 / 文件一键切换；AI 收为单行入口，为正文留出更多空间。</p></figure><figure class="item"><a href="04-外观设置与Typora主题.png"><img src="04-外观设置与Typora主题.png" alt="主题设置"></a><div class="label"><em>04 / APPEARANCE</em><b>你的写作，你的风格</b></div><p>应用外观与文稿样式分开设置，提供 Typora CSS 导入流程。</p></figure><figure class="item"><a href="05-深色写作界面.png"><img src="05-深色写作界面.png" alt="深色模式"></a><div class="label"><em>05 / DARK MODE</em><b>夜间写作，也能保持舒适</b></div><p>低饱和深色覆盖工具栏、侧栏、正文与 AI，保留清晰的信息层级。</p></figure><figure class="item"><a href="06-AI建议-确认后应用.png"><img src="06-AI建议-确认后应用.png" alt="AI建议"></a><div class="label"><em>06 / AI ASSISTANT</em><b>灵感相伴，决定权在你</b></div><p>示例建议先展示，再由用户确认插入；本地、远程与官方服务入口统一。</p></figure></div><footer><span>墨页 · 高保真交互原型 / 2026.11.11</span><span>1600 × 1000 / 6 个界面状态 / 可离线运行</span></footer></main></body></html>
