<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>小彭友 · 图标白色系变体</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 44px 36px;
        background: #fbfbf8;
        color: #23281f;
        font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 6px; }
      h1 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: 0.2px; }
      .sub { font-size: 12.5px; color: #8b9484; }
      .rule { height: 1px; background: #e8eae2; margin: 18px 0 26px; }
      .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
      .card {
        background: #fff;
        border: 1px solid #e7e9e1;
        border-radius: 16px;
        padding: 20px 16px 16px;
        text-align: center;
        box-shadow: 0 1px 2px rgba(35, 40, 31, 0.04);
      }
      .card img { width: 116px; height: 116px; display: block; margin: 0 auto 14px; border-radius: 26px; }
      .card .tag { font-size: 10.5px; letter-spacing: 1px; color: #9aa392; text-transform: uppercase; }
      .card h2 { font-size: 13.5px; font-weight: 650; margin: 4px 0 6px; }
      .card p { font-size: 11.5px; line-height: 1.55; color: #7d8676; margin: 0; }
      .mono { background: #f4f5f1; }
      .mono img { background: #232a25; }
      .dark {
        margin-top: 26px;
        background: #232a25;
        border-radius: 18px;
        padding: 26px 28px 24px;
      }
      .dark .label { font-size: 11.5px; letter-spacing: 1.4px; color: #7f8d80; text-transform: uppercase; margin-bottom: 18px; }
      .dark .row { display: flex; align-items: center; gap: 34px; }
      .dark figure { margin: 0; text-align: center; }
      .dark img { width: 84px; height: 84px; display: block; }
      .dark figcaption { font-size: 11px; color: #93a294; margin-top: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>小彭友 · 图标白色系变体</h1>
      <span class="sub">原图标构图不变，只换配色 / 底色</span>
    </header>
    <div class="rule"></div>

    <div class="grid">
      <div class="card">
        <img src="a-white-classic.png" alt="A" />
        <div class="tag">A</div>
        <h2>白底 · 完整版</h2>
        <p>浅渐变白底，墨绿字形，保留「小彭友」文字</p>
      </div>
      <div class="card">
        <img src="b-white-minimal.png" alt="B" />
        <div class="tag">B</div>
        <h2>白底 · 无文字</h2>
        <p>去掉文字，字形放大，小尺寸下更清楚</p>
      </div>
      <div class="card mono">
        <img src="c-mono-white.png" alt="C" />
        <div class="tag">C</div>
        <h2>纯白 · 透明底</h2>
        <p>全白单色，透明背景，放在深色上使用（下方预览）</p>
      </div>
      <div class="card">
        <img src="d-paper-warm.png" alt="D" />
        <div class="tag">D</div>
        <h2>米白 · 纸感</h2>
        <p>暖白纸感底，比纯白更柔和，不刺眼</p>
      </div>
      <div class="card mono">
        <img src="e-white-outline.png" alt="E" />
        <div class="tag">E</div>
        <h2>白色线框</h2>
        <p>透明底白描边，适合做水印 / 深色横幅 logo</p>
      </div>
    </div>

    <div class="dark">
      <div class="label">在深色背景上看看</div>
      <div class="row">
        <figure><img src="a-white-classic.png" alt="" /><figcaption>A 白底完整</figcaption></figure>
        <figure><img src="b-white-minimal.png" alt="" /><figcaption>B 白底无文字</figcaption></figure>
        <figure><img src="c-mono-white.png" alt="" /><figcaption>C 纯白透明</figcaption></figure>
        <figure><img src="d-paper-warm.png" alt="" /><figcaption>D 米白纸感</figcaption></figure>
        <figure><img src="e-white-outline.png" alt="" /><figcaption>E 白色线框</figcaption></figure>
      </div>
    </div>
  </body>
</html>
